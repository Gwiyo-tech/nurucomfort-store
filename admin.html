<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Nuru Comfort</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .hidden { display: none; }
    .container { max-width: 900px; margin: auto; }
    form { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 10px 20px; background: #4b2e24; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .product-list { background: white; padding: 15px; border-radius: 8px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
    .product-item img { width: 50px; height: 50px; object-fit: cover; margin-right: 10px; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nuru Comfort Admin</h1>
    <!-- Login Section -->
    <div id="loginSection">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="loginError" class="error"></p>
    </div>

    <!-- Admin Panel (hidden until login) -->
    <div id="adminSection" class="hidden">
      <h2>Product Management</h2>
      <button id="logoutBtn">Logout</button>
      <hr>
      <!-- Add/Edit Form -->
      <form id="productForm">
        <input type="hidden" id="productId"> <!-- empty for new, set for edit -->
        <label>Product Name</label>
        <input type="text" id="name" required>
        <label>Description</label>
        <textarea id="description" rows="3"></textarea>
        <label>Price (KES)</label>
        <input type="number" id="price" step="0.01" required>
        <label>Original Price (optional)</label>
        <input type="number" id="originalPrice" step="0.01">
        <label>Stock Quantity</label>
        <input type="number" id="stock" min="0" required>
        <label>Product Photo</label>
        <input type="file" id="photo" accept="image/*">
        <button type="submit">Save Product</button>
        <button type="button" id="cancelEdit" class="hidden">Cancel Edit</button>
      </form>
      <hr>
      <h3>Existing Products</h3>
      <div id="productList" class="product-list"></div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
