<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Nuru Comfort</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .hidden { display: none; }
    .container { max-width: 1200px; margin: auto; }
    h1, h2, h3 { color: #5c3a2e; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 15px; background: #5c3a2e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    button.secondary { background: #6a8b68; }
    button.danger { background: #c0392b; }
    .list-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
    .list-item img { width: 50px; height: 50px; object-fit: cover; margin-right: 10px; }
    .error { color: red; }
    .success { color: green; }
    .info { color: blue; }
    #statusMessage { margin: 10px 0; padding: 10px; border-radius: 4px; }
    #imagePreview { max-width: 200px; max-height: 200px; margin: 10px 0; display: none; }
    .tabs { margin-bottom: 20px; }
    .tabs button { background: #ddd; color: #333; }
    .tabs button.active { background: #5c3a2e; color: white; }
    .category-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .category-item .actions { display: inline-block; margin-left: 20px; }
    .category-item .actions button { padding: 4px 8px; font-size: 12px; }
    .indent { margin-left: 20px; }
    .inline-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .inline-form input, .inline-form select { width: auto; flex: 1; min-width: 150px; margin: 0; }
    .inline-form button { margin: 0; }
    .category-tree { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nuru Comfort Admin</h1>
    <!-- Login Section -->
    <div id="loginSection">
      <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection" class="hidden">
      <button onclick="logout()" class="danger">Logout</button>
      <hr>
      <div class="tabs">
        <button id="tabProductsBtn" class="active" onclick="showTab('products')">Products</button>
        <button id="tabCategoriesBtn" onclick="showTab('categories')">Categories</button>
      </div>

      <!-- Products Tab -->
      <div id="productsTab">
        <div class="card">
          <h2>Add / Edit Product</h2>
          <input type="hidden" id="productId">
          <label>Product Name</label>
          <input type="text" id="name" required>
          <label>Description</label>
          <textarea id="description" rows="3"></textarea>
          <label>Price (KES)</label>
          <input type="number" id="price" step="0.01" required>
          <label>Original Price (optional)</label>
          <input type="number" id="originalPrice" step="0.01">
          <label>Stock Quantity</label>
          <input type="number" id="stock" min="0" required>
          <label>Category</label>
          <select id="categorySelect" required>
            <option value="">Select Category</option>
            <!-- Options loaded from Firestore -->
          </select>
          <label>Product Photo</label>
          <input type="file" id="photo" accept="image/*" onchange="previewImage(this)">
          <img id="imagePreview" alt="Preview">
          <br>
          <button onclick="saveProduct()">Save Product</button>
          <button onclick="cancelEdit()" id="cancelEditBtn" class="hidden">Cancel Edit</button>
        </div>

        <div id="statusMessage"></div>

        <div class="card">
          <h3>Existing Products</h3>
          <div id="productList" class="product-list"></div>
        </div>
      </div>

      <!-- Categories Tab -->
      <div id="categoriesTab" class="hidden">
        <div class="card">
          <h2>Add / Edit Category</h2>
          <input type="hidden" id="categoryId">
          <div class="inline-form">
            <input type="text" id="categoryName" placeholder="Category Name" required>
            <input type="text" id="categoryIcon" placeholder="Icon (emoji)" maxlength="10">
            <select id="parentCategory">
              <option value="">No Parent (Top Level)</option>
              <!-- Populated from Firestore -->
            </select>
            <input type="number" id="categorySortOrder" placeholder="Sort Order" value="0" style="width:100px;">
            <button onclick="saveCategory()">Save Category</button>
            <button onclick="cancelCategoryEdit()" id="cancelCategoryEditBtn" class="hidden">Cancel</button>
          </div>
        </div>

        <div class="card">
          <h3>Category Hierarchy</h3>
          <div id="categoryTree" class="category-tree"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // ====== YOUR FIREBASE CONFIG ======
    const firebaseConfig = {
      apiKey: "AIzaSyC18uMStI4LJXWcjS2EJWGkzMC9gyPTaU0",
      authDomain: "nurucomfort-store.firebaseapp.com",
      projectId: "nurucomfort-store",
      storageBucket: "nurucomfort-store.firebasestorage.app",
      messagingSenderId: "177073380235",
      appId: "1:177073380235:web:7102c99ad76fd0beffad8e",
      measurementId: "G-GK10B0T60R",
    };
    // ================================

    // ====== CLOUDINARY CONFIG ======
    const CLOUDINARY_CLOUD_NAME = 'uv4jkop7';
    const CLOUDINARY_UPLOAD_PRESET = 'nuru_products';
    // ================================

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, getDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let editingProductId = null;
    let editingCategoryId = null;
    let allCategories = [];

    // DOM references
    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const productList = document.getElementById('productList');
    const categoryTree = document.getElementById('categoryTree');
    const statusMessage = document.getElementById('statusMessage');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const cancelCategoryEditBtn = document.getElementById('cancelCategoryEditBtn');
    const imagePreview = document.getElementById('imagePreview');
    const categorySelect = document.getElementById('categorySelect');
    const parentCategorySelect = document.getElementById('parentCategory');

    // Tab switching
    window.showTab = function(tab) {
      document.getElementById('productsTab').classList.toggle('hidden', tab !== 'products');
      document.getElementById('categoriesTab').classList.toggle('hidden', tab !== 'categories');
      document.getElementById('tabProductsBtn').classList.toggle('active', tab === 'products');
      document.getElementById('tabCategoriesBtn').classList.toggle('active', tab === 'categories');
    };

    // Preview image
    window.previewImage = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.src = e.target.result;
          imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    // Logout
    window.logout = async function() {
      await signOut(auth);
    };

    // Cancel edit (product)
    window.cancelEdit = function() {
      clearProductForm();
      editingProductId = null;
      cancelEditBtn.classList.add('hidden');
      statusMessage.textContent = '';
    };

    // Cancel edit (category)
    window.cancelCategoryEdit = function() {
      clearCategoryForm();
      editingCategoryId = null;
      cancelCategoryEditBtn.classList.add('hidden');
    };

    // Upload image to Cloudinary
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', 'products');
      try {
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error?.message || 'Upload failed');
        }
        const data = await response.json();
        return data.secure_url;
      } catch (error) {
        console.error('Cloudinary upload error:', error);
        throw error;
      }
    }

    // Save product
    window.saveProduct = async function() {
      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const originalPrice = document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null;
      const stock = parseInt(document.getElementById('stock').value);
      const categoryId = document.getElementById('categorySelect').value;
      const photoFile = document.getElementById('photo').files[0];

      if (!name || isNaN(price) || isNaN(stock) || !categoryId) {
        showStatus('Please fill all required fields including category.', 'error');
        return;
      }

      try {
        let imageUrl = '';
        if (photoFile) {
          showStatus('Uploading image...', 'info');
          imageUrl = await uploadToCloudinary(photoFile);
        }

        const productData = {
          name,
          description,
          price,
          original_price: originalPrice,
          stock_quantity: stock,
          category_id: categoryId,
          is_active: true,
          updated_at: new Date().toISOString(),
        };

        if (editingProductId) {
          const productRef = doc(db, 'products', editingProductId);
          if (!imageUrl) {
            const oldSnap = await getDoc(productRef);
            productData.image_url = oldSnap.data().image_url;
          } else {
            productData.image_url = imageUrl;
          }
          await updateDoc(productRef, productData);
          showStatus('Product updated successfully!', 'success');
        } else {
          productData.created_at = new Date().toISOString();
          productData.image_url = imageUrl || null;
          await addDoc(collection(db, 'products'), productData);
          showStatus('Product added successfully!', 'success');
        }
        clearProductForm();
        editingProductId = null;
        cancelEditBtn.classList.add('hidden');
        loadProducts();
        loadCategories(); // refresh categories in dropdowns
      } catch (error) {
        console.error('Error saving product:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    };

    // Edit product
    window.editProduct = async function(id) {
      try {
        const docRef = doc(db, 'products', id);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('productId').value = id;
          document.getElementById('name').value = data.name;
          document.getElementById('description').value = data.description || '';
          document.getElementById('price').value = data.price;
          document.getElementById('originalPrice').value = data.original_price || '';
          document.getElementById('stock').value = data.stock_quantity;
          document.getElementById('categorySelect').value = data.category_id || '';
          editingProductId = id;
          cancelEditBtn.classList.remove('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (error) {
        console.error('Error loading product:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    };

    // Delete product
    window.deleteProduct = async function(id) {
      if (confirm('Delete this product?')) {
        try {
          await deleteDoc(doc(db, 'products', id));
          showStatus('Product deleted.', 'success');
          loadProducts();
        } catch (error) {
          console.error('Error deleting product:', error);
          showStatus('Error: ' + error.message, 'error');
        }
      }
    };

    // Save category
    window.saveCategory = async function() {
      const name = document.getElementById('categoryName').value.trim();
      const icon = document.getElementById('categoryIcon').value.trim();
      const parentId = document.getElementById('parentCategory').value || null;
      const sortOrder = parseInt(document.getElementById('categorySortOrder').value) || 0;

      if (!name) {
        alert('Category name is required');
        return;
      }

      try {
        const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const categoryData = {
          name,
          slug,
          icon,
          parent_id: parentId,
          sort_order: sortOrder,
          is_active: true,
          updated_at: new Date().toISOString(),
        };

        if (editingCategoryId) {
          await updateDoc(doc(db, 'categories', editingCategoryId), categoryData);
          showStatus('Category updated successfully!', 'success');
        } else {
          categoryData.created_at = new Date().toISOString();
          await addDoc(collection(db, 'categories'), categoryData);
          showStatus('Category added successfully!', 'success');
        }
        clearCategoryForm();
        editingCategoryId = null;
        cancelCategoryEditBtn.classList.add('hidden');
        loadCategories();
      } catch (error) {
        console.error('Error saving category:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    };

    // Edit category
    window.editCategory = function(id) {
      const cat = allCategories.find(c => c.id === id);
      if (!cat) return;
      document.getElementById('categoryId').value = id;
      document.getElementById('categoryName').value = cat.name;
      document.getElementById('categoryIcon').value = cat.icon || '';
      document.getElementById('parentCategory').value = cat.parent_id || '';
      document.getElementById('categorySortOrder').value = cat.sort_order || 0;
      editingCategoryId = id;
      cancelCategoryEditBtn.classList.remove('hidden');
    };

    // Delete category
    window.deleteCategory = async function(id) {
      if (confirm('Delete this category? Subcategories and products may be affected.')) {
        try {
          await deleteDoc(doc(db, 'categories', id));
          // Optionally, you could set products' category_id to null here
          showStatus('Category deleted.', 'success');
          loadCategories();
        } catch (error) {
          console.error('Error deleting category:', error);
          showStatus('Error: ' + error.message, 'error');
        }
      }
    };

    function clearProductForm() {
      document.getElementById('productId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('description').value = '';
      document.getElementById('price').value = '';
      document.getElementById('originalPrice').value = '';
      document.getElementById('stock').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('photo').value = '';
      imagePreview.style.display = 'none';
    }

    function clearCategoryForm() {
      document.getElementById('categoryId').value = '';
      document.getElementById('categoryName').value = '';
      document.getElementById('categoryIcon').value = '';
      document.getElementById('parentCategory').value = '';
      document.getElementById('categorySortOrder').value = '0';
    }

    function showStatus(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = type;
    }

    // Load categories into dropdowns and tree
    async function loadCategories() {
      try {
        const snapshot = await getDocs(collection(db, 'categories'));
        allCategories = [];
        snapshot.forEach(doc => {
          allCategories.push({ id: doc.id, ...doc.data() });
        });
        allCategories.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || a.name.localeCompare(b.name));

        // Populate product category select (with indentation for hierarchy)
        categorySelect.innerHTML = '<option value="">Select Category</option>';
        parentCategorySelect.innerHTML = '<option value="">No Parent (Top Level)</option>';
        const addOptions = (parentId, prefix) => {
          allCategories.filter(c => c.parent_id === parentId).forEach(cat => {
            const indent = prefix + '— ';
            categorySelect.innerHTML += `<option value="${cat.id}">${indent}${cat.name}</option>`;
            parentCategorySelect.innerHTML += `<option value="${cat.id}">${indent}${cat.name}</option>`;
            addOptions(cat.id, indent);
          });
        };
        addOptions(null, '');

        // Display category tree
        categoryTree.innerHTML = '';
        const displayCategories = (parentId, level) => {
          allCategories.filter(c => c.parent_id === parentId).forEach(cat => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.style.marginLeft = level * 20 + 'px';
            div.innerHTML = `
              <span>${cat.icon || ''} ${cat.name}</span>
              <span class="actions">
                <button onclick="editCategory('${cat.id}')" class="secondary">Edit</button>
                <button onclick="deleteCategory('${cat.id}')" class="danger">Delete</button>
              </span>
            `;
            categoryTree.appendChild(div);
            displayCategories(cat.id, level + 1);
          });
        };
        displayCategories(null, 0);
      } catch (error) {
        console.error('Error loading categories:', error);
        showStatus('Error loading categories: ' + error.message, 'error');
      }
    }

    // Load products list
    async function loadProducts() {
      try {
        const snapshot = await getDocs(collection(db, 'products'));
        productList.innerHTML = '';
        snapshot.forEach(doc => {
          const product = doc.data();
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div style="display:flex; align-items:center;">
              <img src="${product.image_url || 'https://via.placeholder.com/50'}" alt="${product.name}">
              <div>
                <strong>${product.name}</strong> - KES ${product.price.toLocaleString()}
                <br><small>Stock: ${product.stock_quantity}</small>
              </div>
            </div>
            <div>
              <button onclick="editProduct('${doc.id}')">Edit</button>
              <button onclick="deleteProduct('${doc.id}')" class="danger">Delete</button>
            </div>
          `;
          productList.appendChild(item);
        });
      } catch (error) {
        console.error('Error loading products:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    }

    // Auth state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        loadCategories();
        loadProducts();
      } else {
        loginSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginError.textContent = '';
      } catch (error) {
        console.error('Login error:', error);
        loginError.textContent = error.message;
      }
    });
  </script>
</body>
</html>
