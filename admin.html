<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Nuru Comfort</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .hidden { display: none; }
    .container { max-width: 1200px; margin: auto; }
    h1, h2, h3 { color: #5c3a2e; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 15px; background: #5c3a2e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    button.secondary { background: #6a8b68; }
    button.danger { background: #c0392b; }
    .list-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
    .list-item img { width: 50px; height: 50px; object-fit: cover; margin-right: 10px; }
    .error { color: red; }
    .success { color: green; }
    .info { color: blue; }
    #statusMessage { margin: 10px 0; padding: 10px; border-radius: 4px; }
    .tabs { margin-bottom: 20px; }
    .tabs button { background: #ddd; color: #333; }
    .tabs button.active { background: #5c3a2e; color: white; }
    .category-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .category-item .category-name { cursor: pointer; user-select: none; }
    .category-item .category-name:hover { color: #d9b978; }
    .category-item .actions { display: inline-block; margin-left: 15px; }
    .category-item .actions button { padding: 4px 8px; font-size: 12px; }
    .category-item .toggle-icon { display: inline-block; width: 20px; text-align: center; }
    .subcategories { margin-left: 25px; border-left: 2px solid #e0d6c8; padding-left: 10px; }
    .subcategories.collapsed { display: none; }
    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .inline-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .inline-form input, .inline-form select { width: auto; flex: 1; min-width: 150px; margin: 0; }
    .inline-form button { margin: 0; }
    .category-tree { margin-top: 10px; }
    .image-list { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0; }
    .image-item { position: relative; display: inline-block; border: 1px solid #ddd; border-radius: 6px; padding: 5px; background: #fafafa; }
    .image-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; display: block; }
    .image-controls { display: flex; justify-content: space-between; margin-top: 5px; }
    .image-controls button { padding: 2px 6px; font-size: 12px; margin: 0 2px; background: #5c3a2e; color: white; border: none; border-radius: 3px; cursor: pointer; }
    .image-controls .delete-btn { background: #c0392b; }
    .image-controls .move-btn { background: #6a8b68; }
    .image-item .remove-overlay { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nuru Comfort Admin</h1>
    <!-- Login Section -->
    <div id="loginSection">
      <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection" class="hidden">
      <button onclick="logout()" class="danger">Logout</button>
      <hr>
      <div class="tabs">
        <button id="tabProductsBtn" class="active" onclick="showTab('products')">Products</button>
        <button id="tabCategoriesBtn" onclick="showTab('categories')">Categories</button>
      </div>

      <!-- Products Tab -->
      <div id="productsTab">
        <div class="card">
          <h2>Add / Edit Product</h2>
          <input type="hidden" id="productId">
          <label>Product Name</label>
          <input type="text" id="name" required>
          <label>Description</label>
          <textarea id="description" rows="3"></textarea>
          <label>Price (KES)</label>
          <input type="number" id="price" step="0.01" required>
          <label>Original Price (optional)</label>
          <input type="number" id="originalPrice" step="0.01">
          <label>Stock Quantity</label>
          <input type="number" id="stock" min="0" required>
          <label>Category</label>
          <select id="categorySelect" required>
            <option value="">Select Category</option>
          </select>
          <label>Product Photos (multiple allowed)</label>
          <input type="file" id="photo" accept="image/*" multiple onchange="handleFileSelect(this)">
          <div class="image-list" id="imagePreviewList"></div>
          <small>Use arrows to reorder, red button to delete.</small>
          <br>
          <button onclick="saveProduct()">Save Product</button>
          <button onclick="cancelEdit()" id="cancelEditBtn" class="hidden">Cancel Edit</button>
        </div>

        <div id="statusMessage"></div>

        <div class="card">
          <h3>Existing Products</h3>
          <div class="search-box">
            <input type="text" id="productSearch" placeholder="Search products..." oninput="filterProducts()">
          </div>
          <div id="productList" class="product-list"></div>
        </div>
      </div>

      <!-- Categories Tab -->
      <div id="categoriesTab" class="hidden">
        <div class="card">
          <h2>Add / Edit Category</h2>
          <input type="hidden" id="categoryId">
          <div class="inline-form">
            <input type="text" id="categoryName" placeholder="Category Name" required>
            <input type="text" id="categoryIcon" placeholder="Icon (emoji)" maxlength="10">
            <select id="parentCategory">
              <option value="">No Parent (Top Level)</option>
            </select>
            <input type="number" id="categorySortOrder" placeholder="Sort Order" value="0" style="width:100px;">
            <button onclick="saveCategory()">Save Category</button>
            <button onclick="cancelCategoryEdit()" id="cancelCategoryEditBtn" class="hidden">Cancel</button>
          </div>
        </div>

        <div class="card">
          <h3>Category Hierarchy (click to expand/collapse)</h3>
          <div id="categoryTree" class="category-tree"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyC18uMStI4LJXWcjS2EJWGkzMC9gyPTaU0",
      authDomain: "nurucomfort-store.firebaseapp.com",
      projectId: "nurucomfort-store",
      storageBucket: "nurucomfort-store.firebasestorage.app",
      messagingSenderId: "177073380235",
      appId: "1:177073380235:web:7102c99ad76fd0beffad8e",
      measurementId: "G-GK10B0T60R",
    };

    const CLOUDINARY_CLOUD_NAME = 'uv4jkop7';
    const CLOUDINARY_UPLOAD_PRESET = 'nuru_products';

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, getDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let editingProductId = null;
    let editingCategoryId = null;
    let allCategories = [];
    let allProducts = [];
    let imageItems = []; // array of {type:'url', url} or {type:'file', file, preview}

    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const productList = document.getElementById('productList');
    const categoryTree = document.getElementById('categoryTree');
    const statusMessage = document.getElementById('statusMessage');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const cancelCategoryEditBtn = document.getElementById('cancelCategoryEditBtn');
    const imagePreviewList = document.getElementById('imagePreviewList');
    const categorySelect = document.getElementById('categorySelect');
    const parentCategorySelect = document.getElementById('parentCategory');
    const productSearchInput = document.getElementById('productSearch');

    window.showTab = function(tab) {
      document.getElementById('productsTab').classList.toggle('hidden', tab !== 'products');
      document.getElementById('categoriesTab').classList.toggle('hidden', tab !== 'categories');
      document.getElementById('tabProductsBtn').classList.toggle('active', tab === 'products');
      document.getElementById('tabCategoriesBtn').classList.toggle('active', tab === 'categories');
    };

    window.handleFileSelect = function(input) {
      const files = Array.from(input.files);
      files.forEach(file => {
        const previewUrl = URL.createObjectURL(file);
        imageItems.push({ type: 'file', file, preview: previewUrl });
      });
      renderImagePreviews();
      input.value = ''; // allow selecting same file again
    };

    window.renderImagePreviews = function() {
      imagePreviewList.innerHTML = '';
      imageItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'image-item';
        const imgSrc = item.type === 'file' ? item.preview : item.url;
        div.innerHTML = `
          <img src="${imgSrc}" alt="Preview">
          <div class="image-controls">
            <button class="move-btn" onclick="moveImage(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
            <button class="move-btn" onclick="moveImage(${index}, 1)" ${index === imageItems.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="delete-btn" onclick="deleteImage(${index})">×</button>
          </div>
        `;
        imagePreviewList.appendChild(div);
      });
    };

    window.moveImage = function(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= imageItems.length) return;
      const temp = imageItems[index];
      imageItems[index] = imageItems[newIndex];
      imageItems[newIndex] = temp;
      renderImagePreviews();
    };

    window.deleteImage = function(index) {
      const item = imageItems[index];
      if (item.type === 'file' && item.preview) {
        URL.revokeObjectURL(item.preview);
      }
      imageItems.splice(index, 1);
      renderImagePreviews();
    };

    window.logout = async function() { await signOut(auth); };

    window.cancelEdit = function() {
      clearProductForm();
      editingProductId = null;
      cancelEditBtn.classList.add('hidden');
      statusMessage.textContent = '';
    };

    window.cancelCategoryEdit = function() {
      clearCategoryForm();
      editingCategoryId = null;
      cancelCategoryEditBtn.classList.add('hidden');
    };

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', 'products');
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || 'Upload failed');
      }
      const data = await response.json();
      return data.secure_url;
    }

    window.saveProduct = async function() {
      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const originalPrice = document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null;
      const stock = parseInt(document.getElementById('stock').value);
      const categoryId = document.getElementById('categorySelect').value;

      if (!name || isNaN(price) || isNaN(stock) || !categoryId) {
        showStatus('Please fill all required fields including category.', 'error');
        return;
      }

      try {
        // Build final image URLs in order
        const finalImageUrls = [];
        for (const item of imageItems) {
          if (item.type === 'url') {
            finalImageUrls.push(item.url);
          } else if (item.type === 'file') {
            showStatus('Uploading images...', 'info');
            const url = await uploadToCloudinary(item.file);
            finalImageUrls.push(url);
          }
        }

        const productData = {
          name,
          description,
          price,
          original_price: originalPrice,
          stock_quantity: stock,
          category_id: categoryId,
          image_url: finalImageUrls.length > 0 ? finalImageUrls[0] : null,
          image_urls: finalImageUrls,
          is_active: true,
          updated_at: new Date().toISOString(),
        };

        if (editingProductId) {
          const productRef = doc(db, 'products', editingProductId);
          await updateDoc(productRef, productData);
          showStatus('Product updated successfully!', 'success');
        } else {
          productData.created_at = new Date().toISOString();
          await addDoc(collection(db, 'products'), productData);
          showStatus('Product added successfully!', 'success');
        }

        clearProductForm();
        editingProductId = null;
        cancelEditBtn.classList.add('hidden');
        loadProducts();
        loadCategories();
      } catch (error) {
        console.error('Error saving product:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    };

    window.editProduct = async function(id) {
      try {
        const docRef = doc(db, 'products', id);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('productId').value = id;
          document.getElementById('name').value = data.name;
          document.getElementById('description').value = data.description || '';
          document.getElementById('price').value = data.price;
          document.getElementById('originalPrice').value = data.original_price || '';
          document.getElementById('stock').value = data.stock_quantity;
          document.getElementById('categorySelect').value = data.category_id || '';

          // Initialize imageItems from existing images
          imageItems = [];
          const existingUrls = data.image_urls || (data.image_url ? [data.image_url] : []);
          existingUrls.forEach(url => imageItems.push({ type: 'url', url }));
          renderImagePreviews();

          editingProductId = id;
          cancelEditBtn.classList.remove('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (error) {
        console.error('Error loading product:', error);
        showStatus('Error: ' + error.message, 'error');
      }
    };

    window.deleteProduct = async function(id) {
      if (confirm('Delete this product?')) {
        try {
          await deleteDoc(doc(db, 'products', id));
          showStatus('Product deleted.', 'success');
          loadProducts();
        } catch (error) {
          console.error('Error deleting product:', error);
          showStatus('Error: ' + error.message, 'error');
        }
      }
    };

    // Category functions (unchanged)
    window.saveCategory = async function() { /* ... same as before ... */ };
    window.editCategory = function(id) { /* ... same ... */ };
    window.deleteCategory = async function(id) { /* ... same ... */ };
    window.toggleSubcategories = function(categoryId) { /* ... same ... */ };

    function clearProductForm() {
      document.getElementById('productId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('description').value = '';
      document.getElementById('price').value = '';
      document.getElementById('originalPrice').value = '';
      document.getElementById('stock').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('photo').value = '';
      imageItems.forEach(item => {
        if (item.type === 'file' && item.preview) URL.revokeObjectURL(item.preview);
      });
      imageItems = [];
      renderImagePreviews();
    }

    function clearCategoryForm() { /* ... same ... */ }

    function showStatus(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = type;
    }

    async function loadCategories() { /* ... same ... */ }

    async function loadProducts() { /* ... same ... */ }

    window.filterProducts = function() { /* ... same ... */ };

    // Auth state and login (unchanged)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        loadCategories();
        loadProducts();
      } else {
        loginSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginError.textContent = '';
      } catch (error) {
        console.error('Login error:', error);
        loginError.textContent = error.message;
      }
    });

    // Initialize rendering functions
    window.addEventListener('load', () => {
      renderImagePreviews();
    });
  </script>
</body>
</html>
